name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Projects/FraudDetection/**'
  pull_request:
    branches: [main]
    paths:
      - 'Projects/FraudDetection/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects/FraudDetection

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FraudDetection.sln

      - name: Build
        run: dotnet build FraudDetection.sln --no-restore -c Release

      - name: Test
        run: dotnet test FraudDetection.sln --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Projects/FraudDetection/TestResults
          retention-days: 7
